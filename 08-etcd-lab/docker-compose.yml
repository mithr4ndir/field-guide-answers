# Drill 8: a 3-node etcd cluster for the consensus lab. See LAB.md for the steps.
#
#   docker compose up -d
#   docker compose exec etcd1 etcdctl --endpoints=etcd1:2379,etcd2:2379,etcd3:2379 endpoint status -w table
#
# Client ports on the host: etcd1 -> 2379, etcd2 -> 22379, etcd3 -> 32379.
# Set ETCD_IMAGE to use a different image (for example a local mirror).
x-etcd: &etcd
  image: ${ETCD_IMAGE:-gcr.io/etcd-development/etcd:v3.5.17}
  restart: "no"
  environment:
    ETCD_INITIAL_CLUSTER: etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
    ETCD_INITIAL_CLUSTER_STATE: new
    ETCD_INITIAL_CLUSTER_TOKEN: fieldguide-lab
    ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
    ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
    ETCD_DATA_DIR: /etcd-data

services:
  etcd1:
    <<: *etcd
    container_name: etcd1
    command: ["etcd", "--name=etcd1",
              "--advertise-client-urls=http://etcd1:2379",
              "--initial-advertise-peer-urls=http://etcd1:2380"]
    ports: ["2379:2379"]
  etcd2:
    <<: *etcd
    container_name: etcd2
    command: ["etcd", "--name=etcd2",
              "--advertise-client-urls=http://etcd2:2379",
              "--initial-advertise-peer-urls=http://etcd2:2380"]
    ports: ["22379:2379"]
  etcd3:
    <<: *etcd
    container_name: etcd3
    command: ["etcd", "--name=etcd3",
              "--advertise-client-urls=http://etcd3:2379",
              "--initial-advertise-peer-urls=http://etcd3:2380"]
    ports: ["32379:2379"]
